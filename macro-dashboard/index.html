<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard Analisis Makro Ekonomi</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
      <div class="container-fluid">
        <span class="navbar-brand fw-semibold">
          <i class="bi bi-graph-up"></i>
          Dashboard Analisis Makro Ekonomi
        </span>
        <div class="d-flex gap-2 align-items-center">
          <a class="btn btn-outline-light btn-sm" href="https://data.worldbank.org/" target="_blank" rel="noopener">Sumber: World Bank</a>
          <button id="btnReset" class="btn btn-warning btn-sm"><i class="bi bi-arrow-counterclockwise"></i> Reset</button>
        </div>
      </div>
    </nav>

    <main class="container-fluid my-3">
      <!-- Controls -->
      <section class="card shadow-sm mb-3">
        <div class="card-body">
          <div class="row g-3 align-items-end">
            <div class="col-12 col-lg-4">
              <label for="countrySelect" class="form-label">Pilih Negara (maks. 3)</label>
              <select id="countrySelect" class="form-select" multiple></select>
              <div class="form-text">Gunakan Ctrl/Cmd untuk memilih beberapa negara</div>
            </div>

            <div class="col-6 col-lg-2">
              <label for="startYear" class="form-label">Tahun Awal</label>
              <select id="startYear" class="form-select"></select>
            </div>
            <div class="col-6 col-lg-2">
              <label for="endYear" class="form-label">Tahun Akhir</label>
              <select id="endYear" class="form-select"></select>
            </div>

            <div class="col-12 col-lg-4">
              <label class="form-label">Indikator</label>
              <div id="indicatorList" class="d-grid" style="grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5rem;"></div>
              <div class="form-text">Centang indikator yang ingin ditampilkan</div>
            </div>
          </div>
        </div>
      </section>

      <!-- KPI Cards -->
      <section class="mb-3">
        <div class="row g-3" id="kpiRow"></div>
      </section>

      <!-- Charts -->
      <section class="mb-5" id="chartsSection">
        <div id="chartsContainer" class="row g-3"></div>
      </section>
    </main>

    <template id="tplKpi">
      <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <div class="card kpi-card shadow-sm h-100">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <div class="kpi-label text-muted small"></div>
                <div class="kpi-value h4 mb-0 fw-semibold"></div>
                <div class="kpi-subtext text-muted small"></div>
              </div>
              <div class="kpi-icon text-secondary"><i class="bi bi-bar-chart-line fs-2"></i></div>
            </div>
          </div>
        </div>
      </div>
    </template>

    <template id="tplChartCard">
      <div class="col-12">
        <div class="card shadow-sm">
          <div class="card-header d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
              <i class="bi bi-activity text-primary"></i>
              <span class="chart-title fw-semibold"></span>
            </div>
            <div class="d-flex align-items-center gap-2">
              <button class="btn btn-sm btn-outline-secondary btn-download" title="Unduh CSV"><i class="bi bi-download"></i> CSV</button>
              <button class="btn btn-sm btn-outline-secondary btn-toggle-type" title="Ganti tipe chart"><i class="bi bi-shuffle"></i></button>
            </div>
          </div>
          <div class="card-body">
            <div class="chart-canvas-wrapper">
              <canvas></canvas>
              <div class="loading-overlay">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">Memuat...</span>
                </div>
              </div>
            </div>
            <div class="text-muted small mt-2 chart-footnote"></div>
          </div>
        </div>
      </div>
    </template>

    <script src="assets/app.js"></script>
  </body>
</html>
