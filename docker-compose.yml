services:
  web:
    build: .
    container_name: qr-attendance
    restart: unless-stopped
    ports:
      - "3200:3200"
    environment:
      - NODE_ENV=production
      - PORT=3200
      - DATABASE_URL=file:/data/dev.db
      - JWT_SECRET=${JWT_SECRET}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL}
    volumes:
      - data:/data
volumes:
  data:
    driver: local